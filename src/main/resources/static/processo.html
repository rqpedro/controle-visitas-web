<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Visitas - Cadastrar Processo</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <span class="logo">Controle de Visitas</span>
        <nav>
            <a href="area.html">Áreas</a>
            <a href="processo.html" class="ativo">Processos</a>
            <a href="dashboard.html">Visitas</a>
            <a href="index.html">Sair</a>
        </nav>
    </header>

    <main>
        <div class="form-centralizado">
            <a href="dashboard.html" class="link-voltar">‹ Voltar</a>

            <div class="cartao">
                <h2>Cadastrar processo</h2>
                <p class="subtitulo">Informe o nome do processo a ser cadastrado</p>

                <div class="aviso" id="aviso"></div>

                <form id="formProcesso" novalidate>
                    <div class="campo" id="campoNomeProcesso">
                        <label for="nomeProcesso">Nome do processo</label>
                        <input type="text" id="nomeProcesso" name="nomeProcesso">
                        <span class="mensagem-erro">Informe o nome do processo.</span>
                    </div>

                    <button type="submit" class="botao">Cadastrar</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const CONFIG_FORM = {
        idForm: "formProcesso",
        idCampo: "campoNomeProcesso",
        idInput: "nomeProcesso",
        endpoint: "/processos",
        campoApi: "nomeProcesso",
        mensagemSucesso: "Processo cadastrado com sucesso!"
    };
    </script>
    <script src="js/cadastro-simples.js"></script>
</body>
</html>
